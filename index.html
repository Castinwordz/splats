<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Πλάτς & Λέξη</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">

<style>
html,body{
    margin:0;
    padding:0;
    font-family:'Baloo 2', Arial, sans-serif;
    font-weight:600;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    color:white;
    text-align:center;
    overflow-x:hidden;
    background:linear-gradient(to bottom,#0f2027,#203a43,#2c5364);
}

/* ⭐ Stars */
.stars{
    position:fixed;
    width:100%;
    height:100%;
    z-index:0;
}
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{
    from{opacity:0.2;}
    to{opacity:1;}
}

/* 🌙 Moon */
.moon{
    position:absolute;
    top:80px;
    left:-150px;
    width:110px;
    height:110px;
    background:radial-gradient(circle,#fff 40%,#ddd 70%);
    border-radius:50%;
    box-shadow:0 0 50px rgba(255,255,255,0.8);
    animation:moveMoon 60s linear infinite;
}
@keyframes moveMoon{
    from{left:-150px;}
    to{left:110%;}
}

/* 🌊 Water */
.water{
    position:absolute;
    bottom:0;
    width:200%;
    height:160px;
    background:rgba(0,119,190,0.5);
    border-radius:40%;
    animation:wave 8s linear infinite;
    overflow:hidden;
}
@keyframes wave{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
}

/* Ripple */
.ripple{
    position:absolute;
    border:2px solid rgba(255,255,255,0.7);
    border-radius:50%;
    animation:rippleAnim 1s ease-out forwards;
}
@keyframes rippleAnim{
    from{width:0;height:0;opacity:1;}
    to{width:120px;height:120px;opacity:0;}
}

/* 🐸 Frogs */
.frog{
    position:fixed;
    font-size:32px;
    cursor:pointer;
    transition:transform 0.2s;
}
.frog:active{
    transform:scale(1.4);
}

/* Content */
.content{
    position:relative;
    z-index:5;
    padding:20px;
}

header{
    font-size:8vw;
    margin-top:20px;
}

.card{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    margin:20px auto;
    padding:25px;
    border-radius:20px;
    width:90%;
    max-width:800px;
    text-align:left;
}

h2{text-align:center;}

button{
    font-family:'Baloo 2', Arial, sans-serif;
    font-weight:700;
    font-size:16px;
    padding:10px 16px;
    margin:6px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:white;
    color:#2c5364;
}

#timer{
    font-size:32px;
    text-align:center;
}

#finalTime{
    font-size:20px;
    text-align:center;
    margin-top:10px;
    color:#FFD700;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>
<div class="moon"></div>
<div class="water" id="water"></div>

<div class="content">

<header>🌙🎲 Πλάτς & Λέξη 🎲🌙</header>

<div class="card">
<h2>⏱ Χρονοδιακόπτης</h2>
<div id="timer">00:00</div>
<div id="finalTime"></div>

<div style="text-align:center;">
<button onclick="startGame()">▶ Έναρξη</button>
<button onclick="pauseGame()">⏸ Pause</button>
<button onclick="endGame()">⛔ Λήξη</button>
<button onclick="toggleSound()">🔊 Ήχος</button>
<button onclick="toggleFullScreen()">⛶ Πλήρης Οθόνη</button>
</div>
</div>

<div class="card">
<h2>🎯 Στόχος</h2>
<p>Σύλλεξε τα γράμματα που χρειάζεσαι για να φτιάξεις τη λέξη σου. Ο πρώτος που θα τα καταφέρει κερδίζει!</p>
</div>

</div>

<audio id="frogSoundLoop" loop>
<source src="frogs.mp3" type="audio/mpeg">
</audio>

<audio id="frogClick">
<source src="frog-croak.mp3" type="audio/mpeg">
</audio>

<script>
// ⭐ Stars
for(let i=0;i<100;i++){
    let star=document.createElement("div");
    star.className="star";
    star.style.top=Math.random()*100+"%";
    star.style.left=Math.random()*100+"%";
    document.getElementById("stars").appendChild(star);
}

// 🐸 Frogs clickable
for(let i=0;i<8;i++){
    let frog=document.createElement("div");
    frog.className="frog";
    frog.innerText="🐸";
    frog.style.top=Math.random()*80+"%";
    frog.style.left=Math.random()*95+"%";

    frog.onclick=(e)=>{
        document.getElementById("frogClick").play();
        createRipple(e.clientX,e.clientY);
    };

    document.body.appendChild(frog);
}

// Ripple function
function createRipple(x,y){
    let ripple=document.createElement("div");
    ripple.className="ripple";
    ripple.style.left=(x-60)+"px";
    ripple.style.top=(window.innerHeight-150)+"px";
    document.getElementById("water").appendChild(ripple);
    setTimeout(()=>ripple.remove(),1000);
}

// Timer
let seconds=0;
let interval=null;
let running=false;
let gameEnded=false;
let soundOn=false;

function formatTime(sec){
    let mins=Math.floor(sec/60);
    let secs=sec%60;
    return String(mins).padStart(2,'0')+":"+String(secs).padStart(2,'0');
}

function startGame(){
    if(gameEnded){
        seconds=0;
        document.getElementById("finalTime").innerText="";
        document.getElementById("timer").innerText="00:00";
        gameEnded=false;
    }
    if(!running){
        interval=setInterval(()=>{
            seconds++;
            document.getElementById("timer").innerText=formatTime(seconds);
        },1000);
        running=true;
        if(soundOn){
            document.getElementById("frogSoundLoop").play();
        }
    }
}

function pauseGame(){
    clearInterval(interval);
    running=false;
}

function endGame(){
    clearInterval(interval);
    running=false;
    gameEnded=true;
    document.getElementById("finalTime").innerText=
        "🏆 Η παρτίδα διήρκεσε: "+formatTime(seconds);
}

function toggleSound(){
    let audio=document.getElementById("frogSoundLoop");
    if(!soundOn){
        audio.play();
        soundOn=true;
    }else{
        audio.pause();
        soundOn=false;
    }
}

function toggleFullScreen(){
    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
    }else{
        document.exitFullscreen();
    }
}
</script>

</body>
</html>
